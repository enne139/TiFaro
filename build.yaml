# Configurazione di drift: dove tenere le fotografie dello schema del
# database, versione per versione, e le prove delle migrazioni generate da
# `dart run drift_dev make-migrations` (DECISIONI.md, voce 015).
targets:
  $default:
    builders:
      drift_dev:
        options:
          databases:
            tifaro: lib/core/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
