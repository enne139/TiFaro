# Costruisce l'immagine del server di TiFaro e la pubblica su GitHub
# Container Registry, da cui il NAS la scarica.
#
# Si pubblica quando si pubblica un tag che comincia per "v", come l'APK:
# una versione sola per app e server. A ogni modifica del server
# l'immagine si costruisce soltanto, per accorgersi subito se il Dockerfile
# non regge più; lo stesso a mano, dalla scheda Actions.
name: Container

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/container.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/container.yml'
  workflow_dispatch:

# Servono a scrivere nel registro dei pacchetti.
permissions:
  contents: read
  packages: write

jobs:
  immagine:
    name: Costruisci e pubblica
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      # Le prove del server prima: un'immagine con un server rotto non deve
      # arrivare al NAS.
      - name: Prepara Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Prove del server
        working-directory: server
        run: |
          go vet ./...
          go test ./...

      - name: Prepara Docker
        uses: docker/setup-buildx-action@v3

      - name: Entra nel registro
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decidi i nomi dell'immagine
        id: nomi
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tifaro-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Costruisci l'immagine
        uses: docker/build-push-action@v6
        with:
          context: server
          # Anche per ARM (Raspberry, mini PC): Go compila per ARM senza
          # emulazione, quindi costa poco.
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.nomi.outputs.tags }}
          labels: ${{ steps.nomi.outputs.labels }}
          build-args: |
            VERSIONE=${{ steps.nomi.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dove è finita
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "### Immagine pubblicata" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.nomi.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Sul NAS: \`docker compose pull && docker compose up -d\`" >> "$GITHUB_STEP_SUMMARY"
