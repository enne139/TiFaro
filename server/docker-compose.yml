#
# TiFaro: il server che tiene allineate le app (telefono e PC) e fa i
# backup. Spiegazione completa in README.md, accanto a questo file.
#
# Variabili nel .env (accanto a questo file, mai nel repository):
#   TIFARO_TOKEN=...           obbligatorio, la password delle app:
#                              openssl rand -hex 24
#   PUID=... / PGID=...        output di "id" del tuo utente sul NAS
#   TIFARO_BACKUP_LOCATION=... dove vanno i backup; meglio un altro disco.
#                              Senza: ./backup
#   TIFARO_VERSIONE=...        quale versione dell'immagine; senza: latest

name: tifaro

services:
  tifaro:
    container_name: tifaro
    # L'immagine la costruisce GitHub a ogni versione (tag vX.Y.Z) e la
    # pubblica su ghcr.io. Per aggiornare: docker compose pull && docker
    # compose up -d (oppure "Aggiorna" su Dockge).
    image: ghcr.io/enne139/tifaro-server:${TIFARO_VERSIONE:-latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-Europe/Rome}
      TIFARO_TOKEN: ${TIFARO_TOKEN:?imposta TIFARO_TOKEN nel .env}
      # Un backup al giorno, tenendo gli ultimi 30.
      TIFARO_BACKUP_OGNI: ${TIFARO_BACKUP_OGNI:-24h}
      TIFARO_BACKUP_TIENI: ${TIFARO_BACKUP_TIENI:-30}
    volumes:
      # :z per SELinux.
      - ./data:/data:z
      - ${TIFARO_BACKUP_LOCATION:-./backup}:/backup:z
    ports:
      - '8645:8645'
    labels:
      # Diun avvisa quando esce una versione nuova, con il suo numero
      # (es. 0.4.0), invece di dire solo che "latest" è cambiata: guarda i
      # tag del repository dell'immagine e tiene solo quelli X.Y.Z.
      # Il $$ è un $ per la regola: da solo, compose lo prenderebbe per una
      # variabile.
      diun.enable: 'true'
      diun.watch_repo: 'true'
      diun.include_tags: '^\d+\.\d+\.\d+$$'
      diun.sort_tags: semver
      diun.max_tags: '5'
    healthcheck:
      test: ["CMD", "/tifaro-server", "salute"]
      interval: 1m
      timeout: 5s
    restart: always
    # Il server usa pochi MB; il margine serve alla prima sincronizzazione,
    # che arriva tutta insieme.
    mem_limit: 128m
